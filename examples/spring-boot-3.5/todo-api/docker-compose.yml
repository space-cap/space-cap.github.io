services:
  postgres:
    image: postgres:16
    container_name: todo-api-postgres
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    volumes:
      - todo-api-postgres-data:/var/lib/postgresql/data

volumes:
  todo-api-postgres-data:
